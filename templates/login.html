<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("/static/images.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:380px;
    padding:70px 35px 35px;
    border-radius:24px;
    position:relative;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.22);
    box-shadow:0 20px 45px rgba(0,0,0,0.25);
}

.avatar{
    position:absolute;
    top:-50px;
    left:50%;
    transform:translateX(-50%);
    width:100px;
    height:100px;
    border-radius:50%;
    background:#0b2d66;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    color:white;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.title{
    text-align:center;
    color:white;
    font-size:28px;
    font-weight:bold;
    margin-bottom:28px;
}

.input-box{
    display:flex;
    align-items:center;
    margin-bottom:18px;
    border-radius:12px;
    overflow:hidden;
}

.icon{
    width:55px;
    height:54px;
    background:#0b2d66;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.input-box input{
    flex:1;
    height:54px;
    padding:0 16px;
    border:none;
    outline:none;
    font-size:16px;
    color:white;
    background:rgba(20,60,120,0.75);
}

.input-box input::placeholder{
    color:#d7dbe5;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
    margin-bottom:20px;
    font-size:14px;
    color:white;
}

.options label{
    display:flex;
    align-items:center;
    gap:6px;
}

button{
    width:100%;
    height:52px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

a{
    color:white;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="login-box">

<div class="avatar">👤</div>

<div class="title">LOGIN</div>

<form action="/" method="post">

<div class="input-box">
<div class="icon">👤</div>
<input type="email" name="email" placeholder="Email ID" required>
</div>

<div class="input-box">
<div class="icon">🔒</div>
<input type="password" name="password" placeholder="Password" required>
</div>

<div class="options">
<label><input type="checkbox"> Remember me</label>
<a href="#">Forgot Password?</a>
</div>

<button type="submit">LOGIN</button>

</form>

</div>

</div>

</body>
</html>
